[package]
name = "copywheel"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A macOS clipboard manager with a history panel and quick-paste wheel."
repository = "https://github.com/guneskursad/copywheel"
readme = "README.md"

[dependencies]
arboard = "3"
base64 = "0.22"
core-graphics = "0.25.0"
dirs = "7.0.0"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSView", "NSWindow"] }
objc2-foundation = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.27.0"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
